name: Daily Contribution

on:
  schedule:
    # Runs daily at 9:00 AM UTC (2:30 PM IST)
    - cron: '0 9 * * *'
  
  workflow_dispatch:  # Manual trigger button

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Git with your identity
        run: |
          # IMPORTANT: Replace the email below with YOUR no-reply email from:
          # https://github.com/settings/emails
          # Format: USERID+USERNAME@users.noreply.github.com
          
          git config --global user.name "akhilakambhatla"
          git config --global user.email "52831762+akhilakambhatla@users.noreply.github.com"
      
      - name: Generate daily activity
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')
          DAY=$(date '+%A')
          
          # Update last update file
          echo "Last updated: $DATE" > last-update.txt
          
          # Append to activity history
          echo "$DATE - $DAY - Daily commit" >> activity-history.log
          
          # Update counter
          if [ -f activity-count.txt ]; then
            COUNT=$(cat activity-count.txt)
            COUNT=$((COUNT + 1))
          else
            COUNT=1
          fi
          echo $COUNT > activity-count.txt
          
          echo "✅ Day #$COUNT - Files updated successfully!"
      
      - name: Commit and push changes
        run: |
          git add -A
          
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "🌱 Daily contribution: $(date '+%Y-%m-%d')"
            git push origin main
            echo "✅ Successfully pushed to GitHub!"
          fi
